; No php.ini is ever activated in the base php:8.4-fpm-alpine image (only the
; inert php.ini-production/php.ini-development templates ship, unused), which
; leaves PHP's raw compiled defaults in effect: log_errors=Off and
; display_errors=STDOUT (a value that's meaningless for the FPM SAPI — it
; doesn't reach the HTTP response OR a place docker logs captures reliably).
; Net effect: any PHP-level fatal that happens outside Laravel's own
; exception handler (engine fatal, memory exhaustion, opcache issue) is
; completely undisplayable and unloggable — it just vanishes, which is why
; the recurring silent-500 flake has never left a trace anywhere.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
