; Loaded after the base image's www.conf (php-fpm.d/*.conf is included in
; alphabetical order, and a later file's directives for the same pool win),
; so this only needs to state the values we're changing.
[www]

; Recycle each worker after this many requests. The base image doesn't set
; this at all (unlimited), so a worker's opcache/state can only ever
; accumulate for the life of the container. This is standard PHP-FPM
; production hardening against that kind of slow drift.
pm.max_requests = 500

; Without this, a worker that dies (segfault, OOM-killed, fatal error
; outside Laravel's own handler) produces nothing but a bare 500 in the
; access log — nginx/php-fpm's own error log stays silent, which is why
; this class of issue was so hard to diagnose. With it on, a dying
; worker's stdout/stderr is captured into the FPM log (visible via
; `docker logs`), giving an actual error message next time this happens.
catch_workers_output = yes
