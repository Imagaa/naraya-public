server {
    listen 80;
    server_name naraya.test admin.naraya.test sales.naraya.test;
    root /var/www/html/public;
    index index.php;

    # Above Livewire's 12 MB temporary upload (nginx's default 1 MB rejected phone photos with 413).
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Generous for dev cold-starts (slow bind-mount I/O, no opcache warm-up yet).
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
